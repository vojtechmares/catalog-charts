apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "example.fullname" . }}-test-connection"
  labels:
    {{- include "example.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
spec:
  restartPolicy: Never
  containers:
    - name: wget
      image: busybox:1.37
      command: ["wget"]
      args:
        - "--spider"
        - "--timeout=10"
        - "{{ include "example.fullname" . }}:{{ .Values.service.port }}"
